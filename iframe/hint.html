<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>回流路径检查 v{{VERSION}}</title>
<style>
  :root { color-scheme: dark; background: #353535; color: #fff; font: 13px/1.4 "Microsoft YaHei UI", sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; position: relative; height: 100vh; box-sizing: border-box; margin: 0; padding: 0 10px 2px; overflow: hidden; }
  #message { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  small { color: #bdbdbd; white-space: nowrap; }
  button { padding: 2px 10px; color: inherit; font: inherit; background: #4e4e4e; border: 1px solid #222; cursor: pointer; }
  progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; accent-color: #1890ff; }
</style>
</head>
<body>
<strong id="message" role="status">正在准备回流路径检查…</strong>
<small>按 Esc 取消</small>
<button id="cancel" type="button">取消</button>
<progress id="progress" aria-label="计算进度" hidden></progress>
<script>
const bus = (typeof eda === 'undefined' ? window.eda : eda)?.sys_MessageBus;
const topic = 'return-path-inspector.v1.';
let token;
const cancel = () => {
  if (token) bus.publish(topic + 'action', JSON.stringify({ type: 'cancel', token }));
};
const escape = event => {
  if (event.key !== 'Escape' || !token) return;
  event.preventDefault();
  cancel();
};
if (bus) {
  let viewportWidth;
  bus.subscribe(topic + 'hint', raw => {
    const state = typeof raw === 'string' ? JSON.parse(raw) : raw;
    token = state.token;
    const message = document.getElementById('message');
    message.textContent = message.title = state.text;
    document.getElementById('progress').hidden = !state.calculating;
  });
  document.getElementById('cancel').addEventListener('click', cancel);
  window.addEventListener('keydown', escape, true);
  if (window.parent !== window) {
    try {
      viewportWidth = window.parent.innerWidth;
      window.parent.addEventListener('keydown', escape, true);
      window.addEventListener('pagehide', () => window.parent.removeEventListener('keydown', escape, true), { once: true });
    } catch { /* A sandboxed frame can only receive its own keyboard events. */ }
  }
  bus.publish(topic + 'action', JSON.stringify({ type: 'hintReady', viewportWidth }));
}
</script>
</body>
</html>
