<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="logoTitle logoDescription">
  <title id="logoTitle">回流路径检查 · Return Path Inspector</title>
  <desc id="logoDescription">深色 PCB 方形标志，两端铜色焊盘连接多条通道，薄荷绿色曲线高亮当前回流路径。</desc>
  <defs>
    <linearGradient id="tile" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#193640"/>
      <stop offset="1" stop-color="#0B1921"/>
    </linearGradient>
    <linearGradient id="board" x1="100" y1="88" x2="412" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173139"/>
      <stop offset="1" stop-color="#10252C"/>
    </linearGradient>
    <linearGradient id="activeTrace" x1="148" y1="348" x2="364" y2="164" gradientUnits="userSpaceOnUse">
