      <stop offset="1" stop-color="#C99650"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="510" height="510" rx="110" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="109.5" stroke="#6B939B" stroke-opacity=".22" stroke-width="3"/>
  <rect x="76" y="76" width="360" height="360" rx="58" fill="url(#board)" stroke="#36545B" stroke-width="3"/>
  <g fill="#52737A" opacity=".65">
